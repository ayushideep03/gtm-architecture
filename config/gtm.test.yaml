# Test profile: mock providers, fast failure cooldowns.
include:
  - providers/mocks.yaml
selection:
  failure_cooldown_s: 1
execution:
  retry:
    backoff_base_s: 0
    backoff_max_s: 0
    jitter: 0
runtime:
  key_prefix: gtm-test
oxygen:
  decision_engine: rules      # deterministic tests; LLM engine is tested with scripted clients
webhooks:
  allow_unsigned: true          # local convenience only; production requires signatures
providers:
  - {name: icp_rules, priority: 40}   # existing tests drive the mock qualifier; ICP rules are tested directly
